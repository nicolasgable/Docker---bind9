# Genere automatiquement au demarrage depuis /templates/opendkim/opendkim.conf
Syslog                  yes
SyslogSuccess           yes
LogWhy                  yes
UMask                   007
UserID                  opendkim:opendkim
PidFile                 /run/opendkim/opendkim.pid
Socket                  inet:8891@127.0.0.1

# s = signer (mails sortants), v = verifier (mails entrants)
Mode                    sv
Canonicalization        relaxed/simple
OversignHeaders         From
SignatureAlgorithm      rsa-sha256
AutoRestart             yes

# Les mails envoyes via 587/465 (authentifies) portent le daemon_name
# ORIGINATING et sont signes ; les hotes internes aussi.
MTA                     ORIGINATING
InternalHosts           refile:/etc/opendkim/TrustedHosts
ExternalIgnoreList      refile:/etc/opendkim/TrustedHosts

KeyTable                /etc/opendkim/KeyTable
SigningTable            refile:/etc/opendkim/SigningTable
