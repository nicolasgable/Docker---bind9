# Genere automatiquement au demarrage depuis /templates/dovecot/dovecot.conf

protocols = imap lmtp
listen = *
log_path = syslog
syslog_facility = mail
auth_verbose = ${DOVECOT_AUTH_VERBOSE}
auth_debug = ${DOVECOT_AUTH_DEBUG}
auth_mechanisms = plain login
disable_plaintext_auth = yes
# Les utilisateurs peuvent se connecter avec leur adresse mail ou leur uid LDAP ;
# le nom est ensuite normalise vers l'adresse mail (voir dovecot-ldap.conf.ext).
auth_username_format = %Lu

# --- TLS
ssl = required
ssl_cert = <${SSL_CERT_FILE}
ssl_key = <${SSL_KEY_FILE}
ssl_min_protocol = TLSv1.2
ssl_prefer_server_ciphers = yes

# --- Stockage des mails : /var/mail/vhosts/<domaine>/<utilisateur>/Maildir
mail_location = maildir:~/Maildir
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000
last_valid_uid = 5000
mail_privileged_group = vmail

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
  mailbox Archive {
    auto = create
    special_use = \Archive
  }
}

# --- Authentification : LDAP (bind avec le mot de passe de l'utilisateur),
# limitee aux membres du groupe mail.
passdb {
  driver = ldap
  args = /etc/dovecot/dovecot-ldap.conf.ext
}

# Toutes les boites appartiennent a l'utilisateur systeme vmail.
# Postfix a deja verifie dans LDAP que le destinataire existe avant de livrer.
userdb {
  driver = static
  args = uid=vmail gid=vmail home=/var/mail/vhosts/%d/%n allow_all_users=yes
}

# --- Services
service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

# Livraison locale : Postfix -> LMTP -> Maildir
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}

service auth {
  # Socket SASL utilise par Postfix pour authentifier les envois (587/465)
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
  unix_listener auth-userdb {
    mode = 0600
    user = vmail
  }
}

service auth-worker {
  user = $default_internal_user
}

protocol lmtp {
  postmaster_address = postmaster@${MAIL_PRIMARY_DOMAIN}
  # Livraison sur l'adresse complete (user@domaine)
  auth_username_format = %Lu
}

protocol imap {
  mail_max_userip_connections = 20
}
