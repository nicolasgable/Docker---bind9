services:
  mail:
    build: .
    image: mailserver-ldap:latest
    container_name: mailserver
    hostname: ${MAIL_HOSTNAME:-mail.example.local}
    restart: unless-stopped
    env_file: .env
    ports:
      - "25:25"     # SMTP (reception depuis Internet)
      - "465:465"   # SMTPS (envoi clients, TLS implicite)
      - "587:587"   # Submission (envoi clients, STARTTLS)
      - "143:143"   # IMAP (STARTTLS)
      - "993:993"   # IMAPS
    volumes:
      - mail_data:/var/mail/vhosts          # boites aux lettres (Maildir)
      - mail_queue:/var/spool/postfix       # file d'attente Postfix
      - ./dkim:/etc/opendkim/keys           # cles DKIM + DNS-RECORDS.txt
      - ./certs:/etc/mail-certs:ro          # fullchain.pem + privkey.pem
      - ./config:/etc/mail-config:ro        # virtual_aliases (optionnel)
    networks:
      - default
      - ldap
    healthcheck:
      test: ["CMD-SHELL", "postfix status && pgrep -x dovecot && pgrep -x opendkim"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mail_data:
  mail_queue:

networks:
  # Reseau Docker sur lequel tourne deja votre conteneur LDAP
  # (voir "docker network ls"). Le conteneur mail le rejoint pour joindre
  # l'annuaire par son nom (ex: ldap://openldap:389).
  ldap:
    external: true
    name: ${LDAP_NETWORK:-ldap_network}
